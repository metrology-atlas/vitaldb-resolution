[project]
site_name = "vitaldb-resolution"
site_description = "Every recorded VitalDB time and value as a probability distribution of the true value."
use_directory_urls = false
repo_url = "https://github.com/metrology-atlas/vitaldb-resolution"
repo_name = "metrology-atlas/vitaldb-resolution"
edit_uri = "edit/main/docs/"
docs_dir = "docs"
copyright = "© 2026 Andrew J. Goodwin, University of Sydney · code MIT, data CC BY 4.0 (VitalDB)"

nav = [
  { "Home" = "index.md" },
  { "Get started" = "get-started.md" },
  { "How-to guides" = [{ "Get the distribution of one value" = "how-to/one-value.md" }, { "Work with whole tables" = "how-to/whole-tables.md" }, { "Propagate uncertainty with the cache" = "how-to/monte-carlo-cache.md" }, { "Run the HTTP service" = "how-to/http-service.md" }] },
  { "Concepts" = [{ "Heaping and rounding modes" = "concepts/heaping.md" }, { "Charted times and the clock" = "concepts/timestamps.md" }, { "Statuses, kinds and flags" = "concepts/responses.md" }, { "Timing and availability" = "concepts/availability.md" }] },
  { "Reference" = [{ "Variables" = "reference/variables.md" }, { "registry" = "reference/registry.md" }, { "distribution" = "reference/distribution.md" }, { "cache" = "reference/cache.md" }, { "serve" = "reference/serve.md" }, { "engine (internal)" = "reference/engine.md" }] },
]

[project.theme]
features = ["navigation.instant", "navigation.tabs", "navigation.sections", "navigation.top", "navigation.indexes", "toc.follow", "content.code.copy", "search.highlight", "search.suggest"]

[project.theme.icon]
repo = "fontawesome/brands/github"
logo = "lucide/ruler"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon-star"
toggle.name = "Switch to light mode"

[project.extra]
generator = false

[project.plugins.search]

[project.plugins.mkdocstrings.handlers.python]
paths = ["."]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
show_source = false
show_root_heading = true
show_symbol_type_toc = true
show_if_no_docstring = false
separate_signature = true
show_signature_annotations = true
signature_crossrefs = true
members_order = "source"
filters = ["!^_"]

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.tables]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.highlight]
[project.markdown_extensions.toc]
permalink = true
