[project]
name = "vitaldb-resolution"
version = "0.5.0"
description = "VitalDB recorded values and times as probability distributions of the true value"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
authors = [{ name = "Andrew J. Goodwin" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
pandas = ["pandas"]
test = ["pytest", "pandas"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vitaldb_resolution"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E9", "F", "I", "D"]   # errors, imports and Google-style docstrings (the compact one-line style is kept)
ignore = ["D105", "D107", "EXE002"]   # EXE002: the Windows-mounted files look executable

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"tools/**" = ["D"]
